services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATA_DIR: /var/lib/documind
      ALLOWED_ORIGINS: http://localhost:3003
    volumes:
      - ./backend/app:/app/app
      - documind-data:/var/lib/documind
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health')"]
      interval: 20s
      timeout: 4s
      retries: 4
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3003:3003"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      backend:
        condition: service_healthy
volumes:
  documind-data:
